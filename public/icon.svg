<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Background Card -->
  <g filter="url(#shadow)">
    <rect x="110" y="110" width="292" height="180" rx="20" fill="url(#cardGrad2)" opacity="0.85" transform="rotate(-6 256 200)" />
    <!-- Foreground Card -->
    <rect x="110" y="150" width="292" height="180" rx="20" fill="url(#cardGrad)" />
    <rect x="110" y="185" width="292" height="34" fill="#1e3a8a" />
    <circle cx="160" cy="280" r="16" fill="#fbbf24" opacity="0.9" />
    <circle cx="186" cy="280" r="16" fill="#f87171" opacity="0.9" />
    <rect x="230" y="274" width="70" height="12" rx="6" fill="#93c5fd" opacity="0.7" />
  </g>

  <!-- Flowing Trend Arrow / Coin -->
  <g filter="url(#shadow)">
    <circle cx="370" cy="350" r="54" fill="#fbbf24" stroke="#f59e0b" stroke-width="6" />
    <!-- Dollar sign or flow symbol -->
    <text x="370" y="368" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#78350f" text-anchor="middle">R$</text>
    <path d="M120 380 Q 200 320 280 340 T 400 240" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 0" opacity="0.4" />
  </g>
</svg>
